<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python 报错解释器</title>
  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: system-ui, sans-serif;
    }
    textarea {
      width: 100%;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
    }
    button {
      margin: 12px 0;
      padding: 10px 20px;
      cursor: pointer;
    }
    pre {
      background: #f5f5f5;
      padding: 16px;
      white-space: pre-wrap;
      border-radius: 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Python 报错解释器</h1>
  <p>把完整报错信息或代码贴进来：</p>

  <textarea id="q" rows="10" placeholder="Traceback (most recent call last): ..."></textarea>
  <br>
  <button onclick="ask()">解释一下</button>

  <pre id="answer">等待输入...</pre>

  <script>
    async function ask() {
      const q = document.getElementById('q').value.trim();
      const answerEl = document.getElementById('answer');
      if (!q) return;

      answerEl.textContent = '思考中...';

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: q})
        });

        if (!res.ok) throw new Error(await res.text());

        const data = await res.json();
        answerEl.textContent = data.answer;
      } catch (e) {
        answerEl.textContent = '出错了：' + e.message;
      }
    }
  </script>
</body>
</html>
